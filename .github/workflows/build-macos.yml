name: Build macOS arm64 (manual)

# Disparo manual a proposito: el repo es publico, y macOS consume la bolsa de
# minutos gratis de Actions a 10x contra Linux/Windows -- mejor gastarla solo
# cuando de verdad hace falta un build de prueba, no en cada push.
#
# SOLO arm64 (Apple Silicon) a proposito: es el unico build de macOS que el
# maintainer no puede producir en su propia maquina (Windows). El x64 se
# compila local en una VM Hackintosh, y el .dmg para repartir tambien se arma
# ahi mismo -- este workflow entrega solo el .app crudo, listo para
# tools/updater/publish.py --dist, no para instalar directamente.
on:
  workflow_dispatch: {}

jobs:
  build-macos-arm64:
    runs-on: macos-14   # Apple Silicon -- el caso estricto: sin firma no arranca
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pyinstaller==6.22.2

      - name: Compilar DowP (DowP.app + helper de swap, firma ad-hoc incluida)
        working-directory: app
        run: python build_cross_platform.py

      - name: "Leer version de la app (unica fuente: core/version.py)"
        id: appver
        working-directory: app
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0,'src'); from core.version import APP_VERSION; print(APP_VERSION)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Empaquetar el .app preservando firma/atributos (ditto, no zip normal)
        # ditto (no un zip generico) preserva la firma ad-hoc y los atributos
        # extendidos del bundle -- necesario para que publish.py --dist hashee
        # exactamente lo mismo que corrió codesign, y para que quien lo abra
        # despues de instalar tenga una firma intacta.
        working-directory: app/dist
        run: ditto -c -k --keepParent DowP.app DowP-${{ steps.appver.outputs.version }}-arm64-app.zip

      - name: Subir como artifact (para publish.py --dist -- descomprimir con ditto -x -k, no un zip generico)
        uses: actions/upload-artifact@v4
        with:
          name: DowP-${{ steps.appver.outputs.version }}-arm64-app
          path: app/dist/DowP-${{ steps.appver.outputs.version }}-arm64-app.zip
          retention-days: 5
